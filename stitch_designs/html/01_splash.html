m", "fontWeight": "700" }] } } } }</script></head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased flex flex-col min-h-screen"><main class="flex-1 flex flex-col relative w-full pt-safe pb-safe bg-surface"><div class="flex flex-col w-full min-h-[92vh] justify-between items-center px-6 py-8 relative overflow-hidden select-none">
<!-- Subtle Ambient Glow -->
<div class="absolute -top-32 left-1/2 -translate-x-1/2 w-96 h-96 bg-primary-container/20 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-24 left-1/2 -translate-x-1/2 w-80 h-80 bg-primary-container/15 rounded-full blur-2xl pointer-events-none"></div>
<!-- Top Metadata & Session Badge -->
<header class="w-full max-w-sm flex justify-between items-center z-10 pt-2 opacity-80">
<div class="flex items-center gap-2">
<span class="inline-block w-2 h-2 rounded-full bg-primary-container animate-ping"></span>

</div>

</header>
<!-- Central Brand Identity Module -->
<section class="flex flex-col items-center justify-center text-center my-auto z-10 w-full max-w-xs transition-all duration-700 ease-out transform">
<!-- Emblem Container with Layered Tactile Shadow -->
<div class="relative group cursor-pointer">
<div class="absolute inset-0 rounded-full bg-primary-container/30 blur-xl scale-95 transition-transform duration-500 group-hover:scale-110"></div>
<div class="relative w-32 h-32 md:w-36 md:h-36 rounded-full bg-surface-container-lowest shadow-sm flex items-center justify-center p-3 transition-transform duration-500 active:scale-95">
<img alt="STITCH Logo" class="w-full h-full object-contain filter drop-shadow-sm select-none pointer-events-none" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCtT3JMFhV9YRyKG97CD7U6sC26D_PkE-Q2PJ9f6gF9dFwYwb0yY8EVfJaQn5UDVuculQN-YeER09L749T6KPBNth8nuSwBjqcYW33vkrwoV2FA7f5h59_ay-ejQ9o5soBrtmr6Mh9ET-PYFHxLxkNxs2er7fQbtg76gfNCySZfwsSoTNWBHMvw1RKjUqjSVuxygJBPr8XZZLwKQGWsxAuhzna5mKSGIb7nmofTAKyC5_Zvxatf_UPA"/>
</div>
<!-- Micro Sparkle Accent -->
<div class="absolute -top-1 -right-1 w-6 h-6 rounded-full bg-surface-container-lowest shadow-sm flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-xs" style="font-variation-settings: 'FILL' 1;">bolt</span>
</div>
</div>
<!-- Wordmark & Tagline -->
<div class="mt-8 flex flex-col items-center gap-1.5">
<h1 class="font-display-hero-mobile text-display-hero-mobile font-bold tracking-tighter text-on-surface uppercase">
        STITCH
      </h1>
<div class="flex items-center gap-2 mt-0.5">
<span class="h-px w-3 bg-outline-variant"></span>
<p class="font-label-md text-label-md uppercase tracking-widest text-secondary font-semibold">
          Social Fitness Elevated
        </p>
<span class="h-px w-3 bg-outline-variant"></span>
</div>
</div>
</section>
<!-- Bottom Interactive Status & Volt Progress Bar -->
<footer class="w-full max-w-xs flex flex-col items-center z-10 pb-4">
<!-- Progress Indicator Container -->
<div class="w-full flex flex-col items-center gap-3">
<div class="w-full h-1.5 bg-surface-container-highest rounded-full overflow-hidden p-0.5 relative">
<div class="h-full bg-primary-container rounded-full shadow-sm w-1/4 transition-all duration-300 ease-out" id="stitch-progress"></div>
</div>
<!-- Sync Status & State Feedback -->
<div class="w-full flex justify-between items-center px-1">
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-primary text-sm animate-spin" style="animation-duration: 3s;">sync</span>
<span class="font-label-sm text-label-sm uppercase tracking-wider text-secondary" id="stitch-status-text">
            Syncing athlete network...
          </span>
</div>
<span class="font-label-sm text-label-sm font-bold text-on-surface" id="stitch-percent">24%</span>
</div>
</div>
<!-- Community Micro-Ticker -->
<div class="mt-8 flex items-center gap-2 py-1.5 px-3 rounded-full bg-surface-container-low shadow-sm">
<div class="flex -space-x-1.5 overflow-hidden">
<div class="inline-block h-4 w-4 rounded-full bg-primary-container flex items-center justify-center text-[9px] font-bold text-on-primary-fixed">⚡</div>
<div class="inline-block h-4 w-4 rounded-full bg-surface-variant flex items-center justify-center text-[8px] font-bold text-on-surface">M</div>
<div class="inline-block h-4 w-4 rounded-full bg-secondary-container flex items-center justify-center text-[8px] font-bold text-secondary">K</div>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant">
<strong class="font-bold text-on-surface">3.8k</strong> active in your city
      </p>
</div>
</footer>
</div>
<script>
  (function initSplashScreen() {
    const progressBar = document.getElementById('stitch-progress');
    const statusText = document.getElementById('stitch-status-text');
    const percentText = document.getElementById('stitch-percent');
    
    if (!progressBar || !statusText || !percentText) return;

    let progress = 18;
    const steps = [
      { at: 35, text: 'Calibrating personal pace...' },
      { at: 68, text: 'Connecting local squads...' },
      { at: 90, text: 'Preparing energy loop...' },
      { at: 100, text: 'Ready to move.' }
    ];

    const timer = setInterval(() => {
      progress += Math.floor(Math.random() * 9) + 4;
      if (progress >= 100) {
        progress = 100;
        clearInterval(timer);
      }

      progressBar.style.width = progress + '%';
      percentText.textContent = progress + '%';

      const matchedStep = steps.find(s => progress <= s.at);
      if (matchedStep) {
        statusText.textContent = matchedStep.text;
      }
    }, 180);
  })();
</script></main></body></html>
