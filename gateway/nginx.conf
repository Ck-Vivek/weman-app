events {}

http {
    upstream weman_core {
        server weman-core:8080;
    }

    upstream weman_stream {
        server weman-stream:8081;
    }

    server {
        listen 80;

        # Core Spring Boot Microservice routes
        location /api/v1/auth {
            proxy_pass http://weman_core;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/workouts {
            proxy_pass http://weman_core;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # High-Speed Go Stream Microservice routes
        location /api/v1/reels {
            proxy_pass http://weman_stream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/stream {
            proxy_pass http://weman_stream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Gateway Health Check
        location /health {
            return 200 '{"status":"UP","gateway":"weman-api-gateway"}';
            add_header Content-Type application/json;
        }
    }
}
